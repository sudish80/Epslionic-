services:
  agent:
    build: .
    image: epsionic-agent:latest
    container_name: epsionic-agent
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - EPSIONIC_API_KEY=${EPSIONIC_API_KEY:-}
    volumes:
      - ./data:/workspace/data
      - ./config:/workspace/config:ro
      - ./logs:/workspace/logs
      - ./palace:/workspace/palace
    ports:
      - "8000:8000"   # FastAPI server
    command: ["--serve"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    stop_signal: SIGTERM

  dashboard:
    build: .
    image: epsionic-agent:latest
    container_name: epsionic-dashboard
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./data:/workspace/data
      - ./config:/workspace/config:ro
    ports:
      - "7860:7860"   # Gradio dashboard
    command: ["--dashboard", "--skip-domain"]
    profiles: ["dashboard"]
