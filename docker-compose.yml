services:
  agent:
    build: .
    image: epsionic-agent:latest
    container_name: epsionic-agent
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - EPSIONIC_API_KEY=${EPSIONIC_API_KEY:-}
    volumes:
      - ./data:/workspace/data
      - ./config:/workspace/config:ro
      - ./logs:/workspace/logs
      - ./palace:/workspace/palace
    expose:
      - "8000"
    command: ["--serve"]
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "8G"
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    stop_signal: SIGTERM

  nginx:
    image: nginx:alpine
    container_name: epsionic-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      agent:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"

  dashboard:
    build: .
    image: epsionic-agent:latest
    container_name: epsionic-dashboard
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./data:/workspace/data
      - ./config:/workspace/config:ro
    ports:
      - "7860:7860"
    command: ["--dashboard", "--skip-domain"]
    profiles: ["dashboard"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4G"
