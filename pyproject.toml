[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epsionic"
version = "1.0.0"
description = "Production-grade LLM training agent with autonomous domain selection, dataset discovery, and auto-fix"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Epslionic", email = "dev@epsionic.ai"},
]
keywords = ["llm", "training", "fine-tuning", "colab", "unsloth", "qlora"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "huggingface_hub>=0.20.0",
    "datasets>=2.14.0",
    "transformers>=4.36.0",
    "accelerate>=0.24.0",
    "peft>=0.6.0",
    "trl>=0.7.0",
    "bitsandbytes>=0.41.0",
    "openai>=1.0.0",
    "scipy",
    "sentencepiece",
    "einops",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "flake8>=6.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
]
dashboard = [
    "gradio>=5.0",
]
serve = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
]
colab = [
    "google-colab>=1.0",
    "pyngrok>=7.0",
]
benchmarks = [
    "lm-eval>=0.4.0",
]
mempalace = [
    "mempalace>=1.0",
]
all = [
    "epsionic[dashboard,dev,mempalace,serve,colab,benchmarks]",
]

[project.urls]
Homepage = "https://github.com/epsionic/epsionic"
Documentation = "https://github.com/epsionic/epsionic#readme"
Issues = "https://github.com/epsionic/epsionic/issues"

[project.scripts]
epsionic = "epsionic.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
timeout = 30
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "gpu: mark test as requiring GPU (deselect with '-m \"not gpu\"')",
    "network: mark test as requiring network (deselect with '-m \"not network\"')",
]

[tool.coverage.run]
source = ["epsionic"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
strict_optional = true
no_implicit_optional = true
disallow_any_unimported = false
disallow_untyped_defs = false
check_untyped_defs = false
