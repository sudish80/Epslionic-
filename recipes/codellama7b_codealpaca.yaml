name: "CodeLlama 7B + CodeAlpaca"
description: "Fine-tune CodeLlama 7B for code generation on CodeAlpaca"
domain: code
model: "unsloth/codellama-7b-bnb-4bit"
dataset: "lucasmorin/code_alpaca"
format: "### Instruction\n{instruction}\n### Input\n{input}\n### Response\n{output}"
training:
  learning_rate: 2e-4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  max_seq_length: 2048
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 200
  optim: "adamw_8bit"
  bf16: true
  packing: false
