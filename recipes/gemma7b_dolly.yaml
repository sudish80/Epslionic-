name: "Gemma 7B + Dolly"
description: "Instruction-tune Gemma 7B on Databricks Dolly dataset"
domain: general
model: "unsloth/gemma-7b-bnb-4bit"
dataset: "databricks/databricks-dolly-15k"
format: "### Instruction\n{instruction}\n### Context\n{context}\n### Response\n{response}"
training:
  learning_rate: 2e-4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  max_seq_length: 1024
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 200
  optim: "adamw_8bit"
  bf16: true
  packing: false
