name: "Llama 3.1 8B + Alpaca"
description: "Instruction-tune Llama 3.1 8B on Alpaca-style data with QLoRA"
domain: general
model: "unsloth/llama-3.1-8b-bnb-4bit"
dataset: "tatsu-lab/alpaca"
format: "### Instruction\n{instruction}\n### Input\n{input}\n### Response\n{output}"
training:
  learning_rate: 3e-4
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.1
  max_seq_length: 2048
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 2
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 500
  optim: "adamw_8bit"
  bf16: true
  packing: false
